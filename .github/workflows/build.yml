name: Build Content Guard

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'repo/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - jellyfin: '10.10'
            dotnet: '8.0.x'
            version: '1.0.0.0'
          - jellyfin: '10.11'
            dotnet: '9.0.x'
            version: '1.1.0.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Build for Jellyfin ${{ matrix.jellyfin }}
        run: >
          dotnet publish Jellyfin.Plugin.ContentGuard/Jellyfin.Plugin.ContentGuard.csproj
          -c Release -o out
          -p:JellyfinVersion=${{ matrix.jellyfin }}
          -p:PluginVersion=${{ matrix.version }}

      - name: Package
        run: |
          mkdir -p dist
          zip -j -X dist/content-guard-${{ matrix.jellyfin }}.zip out/Jellyfin.Plugin.ContentGuard.dll

      - uses: actions/upload-artifact@v4
        with:
          name: content-guard-${{ matrix.jellyfin }}
          path: dist/*

  publish-repo:
    # Publishes a Jellyfin plugin repository (repo/manifest.json + zips) on main,
    # so servers can install/update Content Guard from Dashboard > Plugins > Repositories.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write manifest
        run: |
          mkdir -p repo
          cp artifacts/*/content-guard-*.zip repo/
          python3 - <<'EOF'
          import hashlib, json, datetime, os
          base = "https://raw.githubusercontent.com/${{ github.repository }}/main/repo/"
          now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          builds = [("1.1.0.0", "10.11.0.0", "content-guard-10.11.zip"),
                    ("1.0.0.0", "10.10.0.0", "content-guard-10.10.zip")]
          versions = []
          for ver, abi, f in builds:
              md5 = hashlib.md5(open(os.path.join("repo", f), "rb").read()).hexdigest()
              versions.append({"version": ver, "changelog": "Build ${{ github.sha }}",
                               "targetAbi": abi, "sourceUrl": base + f + "?v=${{ github.run_number }}",
                               "checksum": md5, "timestamp": now})
          manifest = [{
              "guid": "c4c95473-00dd-462d-9561-f825460e5048",
              "name": "Content Guard",
              "description": "Per-user content blocking by tags, genres and ratings.",
              "overview": "Reliable parental controls: episodes inherit series tags, changes apply instantly, works on every client.",
              "owner": "justhallwest-commits",
              "category": "General",
              "versions": versions}]
          json.dump(manifest, open("repo/manifest.json", "w"), indent=2)
          EOF
          cat repo/manifest.json

      - name: Commit repository files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          git commit -m "Update plugin repository [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
