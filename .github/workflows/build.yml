name: Build Content Guard

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet publish Jellyfin.Plugin.ContentGuard/Jellyfin.Plugin.ContentGuard.csproj -c Release -o out

      - name: Package
        run: |
          mkdir -p dist
          cd out
          zip -j ../dist/content-guard.zip Jellyfin.Plugin.ContentGuard.dll
          cd ..
          md5sum dist/content-guard.zip | tee dist/content-guard.zip.md5

      - uses: actions/upload-artifact@v4
        with:
          name: content-guard
          path: dist/*

      - name: Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*
